[package]
name = "linlog"
description = "A linear logic suite for all your needs."
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

[dependencies]
foldhash = "0.1.5"
rayon = { version = "1.12.0", optional = true }
serde = { version = "1.0.228", features = ["derive"], optional = true }
thiserror = "2.0.17"
unicode-ident = { version = "1.0.26", optional = true }

[features]
default = ["interactive", "latex", "parse", "rocq", "serialize", "svg", "typst"]
interactive = []
latex = []
parse = ["dep:unicode-ident"]
rocq = []
serialize = ["dep:serde"]
svg = []
typst = []
parallel = ["dep:rayon"]

[lints]
workspace = true

[dev-dependencies]
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
serde_json = "1.0.149"
