[package]
name = "linlog-cli"
description = "A linear logic suite for all your needs."
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

# The command is `linlog`; the package keeps its name next to the library's.
[[bin]]
name = "linlog"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "unicode"] }
linlog = { version = "0.1.0", path = "../core" }
serde_json = "1.0.149"

[lints]
workspace = true
