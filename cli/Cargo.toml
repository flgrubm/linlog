[package]
name = "linlog-cli"
description = "A linear logic suite for all your needs."
version = "0.1.0"
edition = "2024"
license = "EUPL-1.2"

# The command is `linlog`; the package keeps its name next to the library's.
# The code is the library `linlog_cli`, so that rustdoc documents it under a
# name of its own: the binary, one call into it, is named like the core
# crate and would otherwise be written over it.
[lib]
name = "linlog_cli"
path = "src/lib.rs"

[[bin]]
name = "linlog"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.54", features = ["derive", "unicode"] }
ctrlc = "3.5.2"
linlog = { version = "0.1.0", path = "../core", features = [
  "interactive",
  "latex",
  "rocq",
  "svg",
  "typst",
] }
serde_json = "1.0.149"

[lints]
workspace = true
